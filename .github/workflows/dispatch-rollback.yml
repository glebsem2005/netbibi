name: Dispatch Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to roll back to (sha-XXXXXXX or vN.N.N)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate image_tag format
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # bash =~ matches the whole string (rejects newlines, NULL, multi-line bypass);
          # length cap guards against pathological inputs.
          if [[ ${#IMAGE_TAG} -gt 64 || ! "$IMAGE_TAG" =~ ^(sha-[0-9a-f]{7,40}|v[0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Invalid image_tag. Expected sha-XXXXXXX (7-40 hex) or vN.N.N"
            exit 1
          fi
          echo "::notice::image_tag validated"

  # No checkout step: the rollback script lives on the VPS, not in the runner.
  rollback:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Rollback on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,ACTOR
          script: |
            bash /home/deploy/apps/netbibi/deploy.sh "$IMAGE_TAG" ROLLBACK "$ACTOR"
