version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Auto-mergeable in spirit: minor and patch bumps tend to be safe.
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Major bumps land in their own PR for deliberate review
      # (e.g. actions/checkout v4→v6 changed Node runtime).
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
