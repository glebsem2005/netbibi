services:
  crawler:
    image: ghcr.io/glebsem2005/netbibi:${TAG:-latest}
    container_name: netbibi-crawler  # do not rename — infra-watcher matches by name
    restart: unless-stopped
    init: true                       # PID 1 reaper, clean signal forwarding
    mem_limit: 1g                    # cap memory so we don't starve neighbours
    cpus: "1.5"                      # cap CPU so we don't starve neighbours
    env_file:
      - .env
    environment:
      MODE: ${MODE:-daemon}
      ALERTER_URL: http://alerter:8080/alert
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    networks:
      - shared
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared:
    external: true
