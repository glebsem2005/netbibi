services:
  crawler:
    image: ghcr.io/glebsem2005/netbibi:${TAG:-latest}
    container_name: netbibi-crawler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODE: ${MODE:-daemon}
      ALERTER_URL: http://alerter:8080/alert
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    networks:
      - shared
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared:
    external: true
