target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N"]

[lint.per-file-ignores]
# fsn_parser.py is an early prototype committed via UI — keep it green
# without rewriting. Will be moved into src/netbibi/ and properly cleaned
# in a follow-up PR.
"fsn_parser.py" = [
    "RUF001", "RUF002", "RUF003",  # Russian-text Cyrillic look-alikes
    "I001",                          # import sorting
    "SIM103", "SIM115",              # control-flow / context managers
    "B905",                          # zip() strict=
    "F541",                          # f-string without placeholders
]
# scripts/ contains Russian regex / markers / docstrings on purpose
# (the project crawls and processes Russian-language pages).
"scripts/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_word_matching.py" = ["RUF001", "RUF002", "RUF003"]

[format]
indent-style = "space"
quote-style = "double"
